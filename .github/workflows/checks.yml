name: Checks and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Run checks

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: demetra
          POSTGRES_PASSWORD: demetra
          POSTGRES_DB: demetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        shell: bash
        run: |
          uv sync --locked --all-extras --dev

      - name: Run pre-commit hooks
        run: |
          uv run pre-commit run --all-files

      - name: Run migrations
        env:
          LOG_PATH: /tmp/demetra.log
          DB_PASSWORD: demetra
        run: |
          uv run alembic upgrade head

      - name: Run tests
        env:
          LOG_PATH: /tmp/demetra.log
          DB_PASSWORD: demetra
        run: |
          uv run pytest tests/
