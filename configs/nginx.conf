server {
    listen 80;
    listen [::]:80;
    server_name demetra.manti.by;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demetra.manti.by;

    location /assets/ {
        alias /home/manti/www/demetra/react/dist/assets/;

        if ($request_filename ~ "^.*/(.+\.(jpe?g|png|svg|avif|js|css|webm|mp4|pdf|ico|woff|woff2|json))$") {
            expires max;
            access_log off;

            add_header Pragma 'public';
            add_header Cache-Control 'public, must-revalidate, proxy-revalidate';
            add_header Access-Control-Allow-Origin *;
            break;
        }

        return 403;
    }

    location /api/ {
        include /home/manti/www/demetra/configs/proxy.params;
        proxy_pass http://127.0.0.1:8001;
    }

    location /rq/ {
        include /home/manti/www/demetra/configs/proxy.params;
        proxy_pass http://127.0.0.1:9181;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        root /home/manti/www/demetra/react/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_certificate /etc/letsencrypt/live/manti.by-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/manti.by-0001/privkey.pem; # managed by Certbot
}
