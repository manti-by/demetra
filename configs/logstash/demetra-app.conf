input {
  file {
    path => "/var/log/demetra/demetra.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/demetra-app"
    codec => "plain"
  }
}

filter {
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:level}:\s+%{GREEDYDATA:log_message}" }
    tag_on_failure => "_grok_parse_failure"
  }

  mutate {
    add_field => { "service" => "demetra-app" }
    add_field => { "service_type" => "python" }
  }

  date {
    match => [ "timestamp", "yyyy-MM-dd HH:mm:ss" ]
    target => "@timestamp"
  }

  mutate {
    remove_field => [ "timestamp" ]
  }
}

output {
  elasticsearch {
    hosts => ["localhost:9200"]
    index => "demetra-app-%{+YYYY.MM.dd}"
  }
}
