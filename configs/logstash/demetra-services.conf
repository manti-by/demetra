input {
  file {
    path => "/var/log/demetra/worker-stdout.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/worker-stdout"
    codec => "plain"
  }
  file {
    path => "/var/log/demetra/worker-stderr.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/worker-stderr"
    codec => "plain"
  }
  file {
    path => "/var/log/demetra/watcher-stdout.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/watcher-stdout"
    codec => "plain"
  }
  file {
    path => "/var/log/demetra/watcher-stderr.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/watcher-stderr"
    codec => "plain"
  }
  file {
    path => "/var/log/demetra/api-stdout.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/api-stdout"
    codec => "plain"
  }
  file {
    path => "/var/log/demetra/api-stderr.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/api-stderr"
    codec => "plain"
  }
  file {
    path => "/var/log/demetra/hera-stdout.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/hera-stdout"
    codec => "plain"
  }
  file {
    path => "/var/log/demetra/hera-stderr.log"
    start_position => "beginning"
    sincedb_path => "/var/lib/logstash/sincedb/hera-stderr"
    codec => "plain"
  }
}

filter {
  if [path] =~ "worker" {
    mutate { add_field => { "service" => "worker" } }
  } else if [path] =~ "watcher" {
    mutate { add_field => { "service" => "watcher" } }
  } else if [path] =~ "api" {
    mutate { add_field => { "service" => "api" } }
  } else if [path] =~ "hera" {
    mutate { add_field => { "service" => "hera" } }
  }

  if [path] =~ "stderr" {
    mutate { add_field => { "stream" => "stderr" } }
  } else {
    mutate { add_field => { "stream" => "stdout" } }
  }

  mutate {
    add_field => { "service_type" => "systemd" }
  }

  if [message] =~ "^\\d{4}-\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}:\\d{2}" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:level}:\s+%{GREEDYDATA:log_message}" }
      tag_on_failure => "_grok_parse_failure"
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss" ]
      target => "@timestamp"
    }
    mutate {
      remove_field => [ "timestamp" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["localhost:9200"]
    index => "demetra-systemd-%{+YYYY.MM.dd}"
  }
}
