[project]
name = "demetra"
version = "1.15.2"
readme = "README.md"
description = "Autonomous coding platform"
requires-python = ">=3.13.9,<3.14.0"
license = "AGPL-3.0"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Chaika", email = "manti.by@gmail.com" }]

dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.1",
    "langchain-groq>=1.1.3",
    "langchain-core>=1.4.9",
    "langsmith>=0.10.5",
    "mcp>=1.28.1",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "python-jose[cryptography]>=3.5.0",
    "python-slugify>=8.0.4",
    "rich>=15.0.0",
    "ruff>=0.15.21",
    "rq>=2.10.0",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51,<2.1.0",
    "uvicorn>=0.51.0",
    "websockets>=16.1",
    "rq-dashboard>=0.9.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "debugpy>=1.8.21",
    "faker>=40.31.0",
    "ipython>=9.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.60",
    "pre-commit>=4.6.0",
    "uv-bump>=0.5.0",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_format = "%(levelname)s %(asctime)s %(message)s"
django_find_project = true
asyncio_mode = "auto"
addopts = '-p no:warnings --color=yes'
norecursedirs = '''
.git
.github
.pytest_cache
.ruff_cache
.venv
wiki
'''

[tool.bandit]
exclude_dirs = [
    "demetra/settings.py",
    "tests/",
    "wiki/"
]
skips = ["B101", "B308", "B703"]

[tool.curlylint.rules]
indent = 2
html_has_lang = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"
exclude = [
    "wiki",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "N",  # pep8-naming
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "S",  # flake8-bandit
    "BLE",  # flake8-blind-except
    "A",  # flake8-builtins
    "DJ",  # flake8-django
    "I",  # isort
    "INP",  # flake8-no-pep420
    "RUF"  # Ruff-specific rules
]
exclude = [
    ".git",
    ".idea",
    ".vscode",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
]
ignore = [
    "DJ001", # Null values for model char fields
    "ERA001",  # Disable eradicate (commented code removal)
    # Disable Conflicting lint rules,
    # see https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E501",
    "E111",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",
    "S603",
    # Disable unused `noqa` directive
    "RUF100",
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "N806",  # Variable `CONSTANT_NAME` in function should be lowercase
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "demetra", "local-folder"]
lines-after-imports = 2

[tool.ruff.lint.isort.sections]
"demetra" = ["demetra"]

[tool.ruff.lint.per-file-ignores]
# Ignore "E402", "F403", "F405" (import violations) in __init__.py files.
# Ignore "S" (flake8-bandit) and "N802" (function name should be lowercase) in tests and docs.
# Ignore "RUF" (Ruff-specific rules) and "I" (isort) in migrations.
"__init__.py" = ["E402", "F403", "F405"]
"**/{tests,docs}/*" = ["E402", "F403", "F405", "S", "N802", "N815"]
"**/*test*.py" = ["E402", "F403", "F405", "S", "N802"]
"**/{settings}/*" = ["E402", "F403", "F405"]
"**/migrations/*" = ["RUF", "I"]

[tool.ty.src]
exclude = [
    ".git",
    ".idea",
    ".vscode",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "wiki"
]
