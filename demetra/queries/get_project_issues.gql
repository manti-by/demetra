query GetProjectIssues($projectId: ID!, $after: String) {
  issues(first: 50, after: $after, includeArchived: true, filter: {project: {id: {eq: $projectId}}}) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      identifier
      url
      title
      description
      priority
      createdAt
      updatedAt
      branchName
      state {
        id
        name
      }
      project {
        id
        name
      }
      labels {
        nodes {
          id
          name
        }
      }
    }
  }
}
