name: demetra

x-demetra-env: &demetra-env
  DB_HOST: postgres
  REDIS_URL: redis://redis:6379/1

x-demetra-base: &demetra-base
  image: mantiby/demetra:latest
  restart: unless-stopped
  env_file: .env.docker

x-demetra-app: &demetra-app
  <<: *demetra-base
  volumes:
    - demetra_app_data:/home/demetra/
    - .:/srv/demetra/src/
    - .keys/.ssh:/home/demetra/.ssh
    - .keys/.gnupg:/home/demetra/.gnupg
    - .keys/.gitconfig:/home/demetra/.gitconfig
    - .keys/.git-credentials:/home/demetra/.git-credentials
    - .keys/gh/hosts.yml:/home/demetra/.config/gh/hosts.yml
    - .keys/opencode/auth.json:/home/demetra/.local/share/opencode/auth.json
    - /mnt/data/www/demetra/log/:/var/log/demetra/
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: demetra-postgres
    env_file: .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME:-demetra}
      POSTGRES_USER: ${DB_USER:-demetra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demetra}
    ports:
      - "54321:5432"
    volumes:
      - demetra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    container_name: demetra-redis
    volumes:
      - demetra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *demetra-base
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: *demetra-env
    volumes:
      - .:/srv/demetra/src/
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *demetra-app
    command:
      [
        "uvicorn",
        "demetra.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--workers",
        "4",
      ]
    environment:
      <<: *demetra-env
      LOG_PATH: /var/log/demetra/api.log
    ports:
      - "8001:8001"

  worker:
    <<: *demetra-app
    command: ["python", "-m", "demetra.worker"]
    environment:
      <<: *demetra-env
      LOG_PATH: /var/log/demetra/worker.log

  watcher:
    <<: *demetra-app
    command: ["python", "-m", "demetra.watcher"]
    environment:
      <<: *demetra-env
      LOG_PATH: /var/log/demetra/watcher.log

  listener:
    <<: *demetra-app
    command: ["python", "-m", "demetra.listener"]
    environment:
      <<: *demetra-env
      LOG_PATH: /var/log/demetra/listener.log

  rq-dashboard:
    <<: *demetra-base
    command:
      [
        "rq-dashboard",
        "--redis-url",
        "redis://redis:6379/1",
        "--bind",
        "0.0.0.0",
        "--port",
        "9181",
      ]
    environment:
      <<: *demetra-env
      LOG_PATH: /var/log/demetra/rq-dashboard.log
    ports:
      - "9181:9181"
    depends_on:
      redis:
        condition: service_healthy

  react-build:
    image: oven/bun:1
    working_dir: /srv/demetra/src/
    command: ["sh", "-c", "bun install --frozen-lockfile && bun run build"]
    restart: "no"
    environment:
      VITE_API_URL: https://demetra.manti.by
    volumes:
      - ./react:/srv/demetra/src

volumes:
  demetra_postgres_data:
    name: demetra_postgres_data
  demetra_redis_data:
    name: demetra_redis_data
  demetra_app_data:
    name: demetra_app_data
