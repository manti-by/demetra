# Uvicorn configuration for production
# This file can be used with: uvicorn --config uvicorn.conf

# Basic settings
app = "fastapi_app:app"
host = "0.0.0.0"
port = 8000
workers = 4

# Performance settings
worker_class = "uvicorn.workers.UvicornWorker"
max_requests = 1000
max_requests_jitter = 100
preload_app = true
timeout = 60
keepalive = 5

# Logging
log_level = "info"
access_log = true
log_config = {
    "version": 1,
    "disable_existing_loggers": false,
    "formatters": {
        "default": {
            "format": "[%(asctime)s] %(levelname)s in %(module)s: %(message)s",
        },
        "access": {
            "format": '[%(asctime)s] "%(request_line)s" %(status_code)s %(content_length)s "%(user_agent)s"',
        },
    },
    "handlers": {
        "default": {
            "formatter": "default",
            "class": "logging.StreamHandler",
            "stream": "ext://sys.stdout",
        },
        "access": {
            "formatter": "access",
            "class": "logging.StreamHandler",
            "stream": "ext://sys.stdout",
        },
    },
    "root": {
        "level": "INFO",
        "handlers": ["default"],
    },
    "loggers": {
        "uvicorn": {"handlers": ["default"], "level": "INFO", "propagate": false},
        "uvicorn.error": {"level": "INFO"},
        "uvicorn.access": {"handlers": ["access"], "level": "INFO", "propagate": false},
    },
}

# SSL settings (uncomment if using SSL)
# ssl_keyfile = "/path/to/private.key"
# ssl_certfile = "/path/to/certificate.crt"
# ssl_ca_certs = "/path/to/ca.crt"